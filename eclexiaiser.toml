# eclexiaiser manifest for dictask

[project]
name = "dictask"

[[functions]]
name = "main"
source = "src/main.rs"
energy-budget-mj = 15.0

[carbon]
provider = "static"
region = "GB"
static-intensity = 200.0

[report]
format = "text"
include-recommendations = true
