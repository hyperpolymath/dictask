#
# Ansible playbook for local dicta-task pipeline setup.
# Sets up: udev rules, systemd service, Rust/Haskell toolchains, SQLite.
---
- name: Setup dicta-task speech-to-do pipeline
  hosts: localhost
  connection: local
  become: false

  vars:
    dicta_task_dir: "{{ ansible_env.HOME }}/Documents/hyperpolymath-repos/dicta-task"
    dicta_task_data_dir: "{{ ansible_env.HOME }}/.local/share/dicta-task"
    dicta_task_archive_dir: "{{ dicta_task_data_dir }}/audio-archive"
    dicta_task_db_path: "{{ dicta_task_data_dir }}/tasks.db"
    # Portable recorder USB identifiers (customise for your device)
    recorder_vendor_id: "XXXX"
    recorder_product_id: "XXXX"

  tasks:
    # ========================================================================
    # Directory setup
    # ========================================================================
    - name: Create dicta-task data directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
      loop:
        - "{{ dicta_task_data_dir }}"
        - "{{ dicta_task_archive_dir }}"
        - "{{ dicta_task_data_dir }}/transcripts"
        - "{{ dicta_task_data_dir }}/candidates"
        - "{{ dicta_task_data_dir }}/views"
        - "{{ dicta_task_data_dir }}/quarantine"
        - "{{ dicta_task_data_dir }}/logs"

    # ========================================================================
    # Initialise SQLite database
    # ========================================================================
    - name: Check if SQLite database exists
      stat:
        path: "{{ dicta_task_db_path }}"
      register: db_stat

    - name: Initialise SQLite database from schema
      command: sqlite3 "{{ dicta_task_db_path }}" ".read {{ dicta_task_dir }}/schemas/tasks.sql"
      when: not db_stat.stat.exists

    # ========================================================================
    # udev rule for recorder detection
    # ========================================================================
    - name: Install udev rule for portable recorder
      become: true
      copy:
        dest: /etc/udev/rules.d/99-dicta-task-recorder.rules
        content: |
          # dicta-task: trigger pipeline when portable voice recorder is connected
          # Customise VENDOR_ID and PRODUCT_ID for your recorder
          # Find yours with: lsusb
          ACTION=="add", SUBSYSTEM=="usb", ATTR{idVendor}=="{{ recorder_vendor_id }}", ATTR{idProduct}=="{{ recorder_product_id }}", TAG+="systemd", ENV{SYSTEMD_WANTS}="dicta-task-ingest.service"
        mode: "0644"
      notify: Reload udev rules

    # ========================================================================
    # systemd service for pipeline
    # ========================================================================
    - name: Install dicta-task systemd user service
      copy:
        dest: "{{ ansible_env.HOME }}/.config/systemd/user/dicta-task-ingest.service"
        content: |
          [Unit]
          Description=dicta-task speech-to-do pipeline ingest
          After=local-fs.target

          [Service]
          Type=oneshot
          ExecStart={{ dicta_task_dir }}/target/release/dicta-task-ingest
          Environment=DICTA_TASK_DATA_DIR={{ dicta_task_data_dir }}
          Environment=DICTA_TASK_DB_PATH={{ dicta_task_db_path }}
          StandardOutput=append:{{ dicta_task_data_dir }}/logs/ingest.log
          StandardError=append:{{ dicta_task_data_dir }}/logs/ingest-error.log

          [Install]
          WantedBy=default.target
        mode: "0644"
      notify: Reload systemd user daemon

    - name: Install dicta-task systemd timer (periodic batch check)
      copy:
        dest: "{{ ansible_env.HOME }}/.config/systemd/user/dicta-task-batch.timer"
        content: |
          [Unit]
          Description=dicta-task periodic batch processing

          [Timer]
          OnCalendar=*:0/15
          Persistent=true

          [Install]
          WantedBy=timers.target
        mode: "0644"

    - name: Enable dicta-task batch timer
      systemd:
        name: dicta-task-batch.timer
        scope: user
        enabled: true
        state: started

  handlers:
    - name: Reload udev rules
      become: true
      command: udevadm control --reload-rules && udevadm trigger

    - name: Reload systemd user daemon
      systemd:
        daemon_reload: true
        scope: user
